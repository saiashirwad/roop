services:
  harness:
    command: pnpm --filter @roop/coding-harness exec tsx src/Serve.ts "$PORT"
    port: 8787
  web:
    command: pnpm --filter @roop/coding-web exec vite --host 0.0.0.0 --port "$PORT" --strictPort
    env:
      HARNESS_URL: http://127.0.0.1:8787
    health: /
    portal:
      title: Roop Web
      description: Browser client backed by the local harness RPC server.
